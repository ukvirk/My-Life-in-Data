<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Telemetry | Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="command-hud" class="hud-panel">
      <div class="hud-header">
        <h3>Data Ingestion</h3>
        <button id="toggle-hud" class="btn-ghost">Close [ESC]</button>
      </div>
      <div class="hud-form">
        <div class="input-group">
          <label>Date Identity</label>
          <input type="text" id="in-date" placeholder="e.g. May 24" />
        </div>
        <div class="input-group">
          <label>Deep Code (Hrs)</label>
          <input type="number" id="in-code" step="0.5" placeholder="0.0" />
        </div>
        <div class="input-group">
          <label>Rest Cycle (Hrs)</label>
          <input type="number" id="in-sleep" step="0.5" placeholder="0.0" />
        </div>
        <div class="input-group">
          <label>Hydration (Liters)</label>
          <input type="number" id="in-water" step="0.1" placeholder="0.0" />
        </div>
        <div class="input-group">
          <label>Gym Routine (Hrs)</label>
          <input type="number" id="in-gym" step="0.5" placeholder="0.0" />
        </div>
        <button id="btn-commit" class="btn-primary">COMMIT RECORD</button>
      </div>
    </div>

    <div id="app">
      <aside class="dashboard-sidebar">
        <header class="profile-header">
          <h2 id="user-identity">Operator</h2>
          <div class="version-tag">OS V_3.0.0</div>
        </header>
        <div class="profile-meta-deck">
          <button id="btn-open-hud" class="btn-primary full-width">+ LOG NEW DAY</button>
          <button id="btn-purge" class="btn-danger full-width" style="margin-top:10px;">PURGE DATA</button>
        </div>
        
        <div class="diagnostic-panel" style="margin-top:40px;">
          <h3 style="font-size:12px; color:#8A8D9E; margin-bottom:15px;">LATEST DIAGNOSTICS</h3>
          <div id="diag-feed">
            </div>
        </div>
      </aside>

      <main class="bento-workspace">
        <header class="workspace-header">
          <h1>Command Center</h1>
          <p>Historical array mapping and biological evaluation.</p>
        </header>
        
        <div class="bento-grid-container">
          <div class="bento-card span-double">
            <div class="card-header-block">
              <h3>Time Allocation Matrix</h3>
              <p>Chronological work vs rest cycles</p>
            </div>
            <div class="chart-canvas-wrapper"><canvas id="timeMatrixChart"></canvas></div>
          </div>

          <div class="bento-card">
            <div class="card-header-block">
              <h3>Hydration Telemetry</h3>
              <p>WHO Baseline: 2.7L</p>
            </div>
            <div class="chart-canvas-wrapper"><canvas id="hydrologyBarChart"></canvas></div>
          </div>
          
          <div class="bento-card">
            <div class="card-header-block">
              <h3>Physical Conditioning</h3>
              <p>Gym duration output</p>
            </div>
            <div class="chart-canvas-wrapper"><canvas id="gymRadarChart"></canvas></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
