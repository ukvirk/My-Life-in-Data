<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Life In Data | Elite Telemetry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="boot-loader">
      <div class="loader-pulse"></div>
      <p>INITIALIZING TELEMETRY...</p>
    </div>

    <div id="app" class="hidden">
      <aside class="dashboard-sidebar">
        <header class="profile-header">
          <h2>Telemetry</h2>
          <div class="version-tag">OS V_2.0.26</div>
        </header>
        <div class="profile-meta-deck">
          <div class="meta-stat-strip">
            <span class="label">Uplink:</span>
            <span class="status-indicator">Stabilized</span>
          </div>
          <div class="meta-stat-strip">
            <span class="label">Data Nodes:</span>
            <span class="value">Active</span>
          </div>
        </div>
      </aside>

      <main class="bento-workspace">
        <header class="workspace-header">
          <h1>Command Center</h1>
          <p>Real-time biometric and productivity sync.</p>
        </header>
        
        <div class="bento-grid-container">
          <div class="bento-card span-double animate-in delay-1">
            <div class="card-header-block">
              <h3>Time Allocation Matrix</h3>
              <p>Deep Work vs. Recovery Variables</p>
            </div>
            <div class="chart-canvas-wrapper">
              <canvas id="timeMatrixChart"></canvas>
            </div>
          </div>

          <div class="bento-card animate-in delay-2">
            <div class="card-header-block">
              <h3>Hydration Telemetry</h3>
              <p>Volumetric Output (Liters)</p>
            </div>
            <div class="chart-canvas-wrapper">
              <canvas id="hydrologyBarChart"></canvas>
            </div>
          </div>

          <div class="bento-card animate-in delay-3">
            <div class="card-header-block">
              <h3>Macro Composition</h3>
              <p>Nutritional Density</p>
            </div>
            <div class="chart-canvas-wrapper">
              <canvas id="macrosDoughnutChart"></canvas>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
