<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Telemetry Command Center</title>
  </head>
  <body>
    <div id="app" class="relative min-h-screen flex flex-col md:flex-row w-full overflow-hidden bg-background">
      <!-- Main Dashboard Area -->
      <main class="flex-1 p-6 md:p-12 overflow-y-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
          <div>
            <h1 class="text-4xl font-bold tracking-tight text-white mb-2">APEX <span class="text-neon-cyan">TELEMETRY</span></h1>
            <p class="text-white/60 text-sm">Human Performance Optimization Engine</p>
          </div>
          <div class="flex gap-4 flex-wrap">
            <input type="date" id="date-picker" class="glass-input w-auto text-sm cursor-pointer" />
            <button id="btn-export" class="glass-input w-auto text-sm hover:bg-white/10 transition-colors">Export</button>
            <button id="btn-import" class="glass-input w-auto text-sm hover:bg-white/10 transition-colors">Import</button>
            <input type="file" id="file-import" class="hidden" accept=".json" />
          </div>
        </header>

        <!-- Bento Grid for Metrics -->
        <div id="metric-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-10">
          <!-- Metrics injected here -->
        </div>

        <!-- Chart Engine Container -->
        <div class="glass-panel p-6 h-[400px] w-full flex flex-col">
          <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-neon-cyan animate-pulse-subtle"></div>
            Historical Trend Analysis
          </h2>
          <div class="relative flex-1 w-full min-h-0">
            <canvas id="historical-chart"></canvas>
          </div>
        </div>
      </main>

      <!-- Command HUD (Right Side) -->
      <aside id="command-hud" class="fixed inset-y-0 right-0 w-full md:relative md:w-[400px] glass-panel rounded-none border-l border-t-0 border-b-0 border-r-0 border-white/10 p-8 flex flex-col h-screen overflow-y-auto z-50 translate-x-full md:translate-x-0 transition-transform duration-500 bg-background md:bg-transparent">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-2xl font-bold text-neon-pink">COMMAND HUD</h2>
          <button id="btn-close-hud" class="md:hidden text-white/50 hover:text-white text-xl">✕</button>
        </div>
        
        <form id="hud-form" class="flex flex-col gap-6 flex-1">
          <div id="hud-inputs" class="flex flex-col gap-4 overflow-y-auto pr-2 pb-10">
            <!-- Inputs injected here -->
          </div>
          
          <div class="mt-auto pt-4 border-t border-white/10 bg-background md:bg-transparent sticky bottom-0">
            <button type="submit" class="neon-button w-full">COMMIT TELEMETRY</button>
          </div>
        </form>
      </aside>

      <!-- Mobile HUD Toggle -->
      <button id="btn-toggle-hud" class="md:hidden fixed bottom-6 right-6 z-40 neon-button rounded-full w-14 h-14 flex items-center justify-center shadow-neon-pink bg-background">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF007F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
